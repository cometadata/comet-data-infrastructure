[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1,<2",
    "pyarrow>=19,<24",
    "cyclopts>=4,<5",
    "python-magic>=0.4,<1",
    "tqdm>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
infra = [
    "sceptre>=4,<5",
    "sceptre-ssm-resolver>=1,<2",
]
notebooks = [
    "jupyterlab>=4,<5",
    "jupysql>=0.11.1,<1",
    "duckdb_engine>=0.17.0,<1",
]
docling = [
    "docling>=2,<3",
]

[tool.uv]
conflicts = [
    [
        { extra = "infra" },
        { extra = "notebooks" },
        { extra = "docling" },
    ],
]

[project.scripts]
comet = "comet.cli:main"
