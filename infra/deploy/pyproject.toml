[project]
name = "comet-deploy"
version = "0.0.0"
description = "Deployment commands for COMET environments"
requires-python = "==3.12.*"
dependencies = [
    "boto3>=1,<2",
    "cyclopts>=4,<5",
    "pyyaml>=6,<7",
]

[project.scripts]
comet-deploy = "comet_deploy.cli:main"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"
