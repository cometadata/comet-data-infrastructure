template:
  path: endpoints.j2
  type: file

dependencies:
  - dev/network.yaml
  - dev/security-groups.yaml

parameters:
  VpcId: !stack_attr sceptre_user_data.vpc_id
  PublicRouteTableId: !stack_output_external {{ var.route_table_stack_output }}
  PrivateRouteTableId: !stack_output dev/network.yaml::PrivateRouteTableId
  # Interface endpoint ENIs live in the AZ-a private subnet, alongside the services.
  SubnetIds:
    - !stack_output dev/network.yaml::PrivateSubnetAId
  SecurityGroupId: !stack_output dev/security-groups.yaml::EndpointsSecurityGroupId
