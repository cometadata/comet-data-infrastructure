template:
  path: batch-jobs.j2
  type: file

dependencies:
  - dev/s3.yaml

parameters:
  Env: "{{ var.env }}"
  # Digest-pinned image URIs selected before deployment.
  BatchImage: !ssm {{ stack_group_config.sceptre_user_data.ssm_path }}/images/batch
  MarpleImage: !ssm {{ stack_group_config.sceptre_user_data.ssm_path }}/images/marple
  DataBucketName: !stack_output dev/s3.yaml::DataBucketName
  OpenSearchImage: public.ecr.aws/opensearchproject/opensearch:2.17.1
  DataCiteCredentialsSecretArn: "{{ var.datacite_credentials_secret_arn }}"

capabilities:
  - CAPABILITY_IAM
  - CAPABILITY_NAMED_IAM
