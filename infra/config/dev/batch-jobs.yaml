template:
  path: batch-jobs.j2
  type: file

dependencies:
  - dev/s3.yaml
  - dev/dynamodb.yaml

{% set image_tag = "!ssm " ~ stack_group_config.sceptre_user_data.ssm_path ~ "/images/tag" %}
parameters:
  Env: "{{ var.env }}"
  # The promoted image tag (see make promote), resolved to digest-pinned URIs at deploy time.
  ImageTag: {{ image_tag }}
  BatchImage: !ecr_image
    repository: comet-{{ var.env }}-batch
    tag: {{ image_tag }}
  MarpleImage: !ecr_image
    repository: comet-{{ var.env }}-marple
    tag: {{ image_tag }}
  DataBucketName: !stack_output dev/s3.yaml::DataBucketName
  OpenSearchImage: public.ecr.aws/opensearchproject/opensearch:2.17.1
  DataCiteCredentialsSecretArn: "{{ var.datacite_credentials_secret_arn }}"
  HfCredentialsSecretArn: "{{ var.hf_credentials_secret_arn }}"
  DatasetReleasesTableArn: !stack_output dev/dynamodb.yaml::DatasetReleasesTableArn

capabilities:
  - CAPABILITY_IAM
