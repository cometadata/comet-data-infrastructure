name: CI

on: push

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install uv
        run: |
          source versions.env
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache uv
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install
        run: make install

      - name: Check formatting
        run: make fmt-ci

      - name: Lint
        run: make lint-ci

      - name: Test
        run: make test
