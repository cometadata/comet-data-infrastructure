AWSTemplateFormatVersion: '2010-09-09'

Description: 'Elastic container registry for Comet Docker images'

Parameters:
  RepositoryName:
    Type: String

Resources:
  Repository:
    Type: 'AWS::ECR::Repository'
    DeletionPolicy: 'Retain'
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "action": {
                  "type": "expire"
                },
                "selection": {
                  "countType": "imageCountMoreThan",
                  "countNumber": 1,
                  "tagStatus": "tagged",
                  "tagPrefixList": [
                    "latest"
                  ]
                },
                "description": "Ensure that we do not have more than 1 tagged version",
                "rulePriority": 1
              },
              {
                "action": {
                  "type": "expire"
                },
                "selection": {
                  "countType": "imageCountMoreThan",
                  "countNumber": 3,
                  "tagStatus": "untagged"
                },
                "description": "Only retain the last 3 versions",
                "rulePriority": 2
              }
            ]
          }

Outputs:
  RepositoryName:
    Value: !Ref Repository
  RepositoryARN:
    Value: !GetAtt Repository.Arn
  RepositoryURI:
    Value: !GetAtt Repository.RepositoryUri
